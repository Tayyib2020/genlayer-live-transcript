<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Signal Ledger</title>
  <desc id="desc">Gold signal mark on a charcoal background</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#252a32" />
      <stop offset="1" stop-color="#0f1217" />
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe3a1" />
      <stop offset="0.45" stop-color="#e7aa2f" />
      <stop offset="1" stop-color="#bd7b10" />
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bg)" />
  <rect x="3" y="3" width="58" height="58" rx="14" fill="none" stroke="#e7aa2f" stroke-opacity="0.3" stroke-width="2" />
  <g transform="translate(32 32) rotate(45)">
