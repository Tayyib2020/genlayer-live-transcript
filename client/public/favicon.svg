  </g>
  <path d="M14 39c3-6 6-9 9-9 3 0 4 5 7 5 3 0 5-7 8-7 3 0 5 3 12 3" fill="none" stroke="#fff7df" stroke-opacity="0.88" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
